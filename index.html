<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KaBijoux – Facturation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Quicksand:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0e8de;--card:#fff;--tx:#4a3f45;--mut:#8c7b80;--bd:#e6d6cc;--pri:#b86098;--r:6px;--hf:'Cormorant Garamond',serif;--bf:'Source Sans 3',sans-serif;--tint:#f4e3ec;--tint2:#faf3f6;--band:#dbafcb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 var(--bf),system-ui,-apple-system,Segoe UI,Arial,sans-serif}
#app{display:flex;min-height:100vh}
nav{width:210px;background:var(--bg);border-right:1px solid var(--bd);padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font:700 24px var(--hf);color:var(--pri);margin:0 8px 14px;text-align:center}.logo img{max-width:150px;height:auto}.band{background:var(--band);color:#fff;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:12px;padding:10px 16px;border-radius:var(--r);margin-bottom:16px;display:flex;gap:22px;flex-wrap:wrap}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:10px 12px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;margin-bottom:4px}
nav button.on,nav button:hover{background:color-mix(in srgb,var(--pri) 12%,transparent);color:var(--pri)}
main{flex:1;padding:24px;max-width:1200px;min-width:0}
h1,h3{font-family:var(--hf)}h1{font-size:26px;margin:0 0 16px}h3{margin:0 0 10px;font-size:17px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(0,0,0,.05)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi small{color:var(--mut)}.kpi b{display:block;font-size:22px;margin-top:2px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:calc(var(--r)*1.6);padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.r{background:transparent;color:var(--bad);border:1px solid var(--bd)}
.btn.s{padding:5px 9px;font-size:12px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;font:inherit}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table.l{width:100%;border-collapse:collapse}.l th{text-align:left;color:var(--mut);font-size:12px;font-weight:500;padding:6px}
.l td{padding:9px 6px;border-top:1px solid var(--bd)}.tr{text-align:right}
.badge{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.draft{background:#e5e7eb;color:#374151}.sent{background:#fef3c7;color:#92400e}.paid{background:#dcfce7;color:#166534}.late{background:#fee2e2;color:#991b1b}
.ed{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
.line{border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px}
.line .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px}
.paper{background:#fff;color:#111827;border-radius:6px;padding:30px;min-height:560px;box-shadow:0 6px 24px rgba(0,0,0,.12);font-size:12px}
.paper h2{margin:0;font:700 20px var(--hf)}.paper .mut{color:#6b7280}
.paper .head{display:flex;justify-content:space-between;gap:12px;margin-bottom:20px}
.paper .tag{font-family:var(--hf);font-size:22px;font-weight:700;letter-spacing:.04em;color:var(--pri)}
.paper table{width:100%;border-collapse:collapse;margin:16px 0}.paper th{background:var(--tint);text-align:left;padding:6px;font-size:11px}
.paper td{padding:7px 6px;border-bottom:1px solid #eee}
.paper .tot{margin-left:auto;width:250px}.paper .tot div{display:flex;justify-content:space-between;padding:3px 0}
.paper .big{font-weight:700;font-size:14px;border-top:2px solid var(--pri);margin-top:4px;padding-top:6px!important}
.empty{color:var(--mut);text-align:center;padding:24px}.paper.t-doux{border-top:8px solid var(--pri);border-radius:var(--r)}.paper.t-cadre{border:3px double var(--pri);border-radius:var(--r)}.paper.t-bandeau .head{background:var(--pri);color:#fff;margin:-30px -30px 20px;padding:24px 30px;border-radius:6px 6px 0 0}.paper.t-bandeau .head .mut,.paper.t-bandeau .head .tag{color:#fff}.paper .thx{text-align:center;margin-top:22px;font:600 16px var(--hf);color:var(--pri)}
::selection{background:var(--band);color:#fff}
body{background:radial-gradient(900px 500px at 100% -10%,var(--tint),transparent 60%),radial-gradient(700px 420px at -10% 110%,var(--tint),transparent 60%),var(--bg);background-attachment:fixed}
nav{background:color-mix(in srgb,var(--card) 55%,var(--bg));padding:22px 14px}
nav button{font-weight:600;letter-spacing:.02em;border-radius:var(--r);transition:.2s;position:relative}
nav button.on{background:var(--card);color:var(--pri);box-shadow:0 6px 16px -8px var(--pri)}
nav button.on:after{content:'';position:absolute;left:12px;right:12px;bottom:6px;height:1px;background:var(--pri)}
.logo{padding-bottom:12px;border-bottom:1px solid var(--bd)}
main>*:not(.ed){animation:up .5s both}@keyframes up{from{opacity:0;transform:translateY(8px)}}
h1{font-size:34px;font-weight:600;letter-spacing:.01em}h3{font-size:19px;font-weight:600}
.card{border-color:transparent;box-shadow:0 1px 2px rgba(74,63,69,.05),0 12px 30px -14px var(--pri)}
.kpi{position:relative;overflow:hidden;padding-top:18px}.kpi:before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--pri),var(--band))}
.kpi b{font:600 32px var(--hf)}.kpi small{text-transform:uppercase;letter-spacing:.07em;font-size:11px}
.kpi .ic{float:right;width:36px;height:36px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:16px}
.band{display:block;padding:0;overflow:hidden}.mq{display:flex;width:max-content;padding:10px 0;animation:mq 24s linear infinite}.mq span{white-space:nowrap;margin-right:44px}@keyframes mq{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.mq,main>*{animation:none}}
.l{border-collapse:separate;border-spacing:0}.l th{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600}.l tr:hover td{background:var(--tint2)}
.badge{padding:3px 11px;font-size:11px;letter-spacing:.03em}.draft{background:#efe6df;color:#7a6a66}.sent{background:#fbe6ef;color:#a3407a}.paid{background:#e3f1e4;color:#3d7a45}.late{background:#fde4e1;color:#b3392f}
.btn{box-shadow:0 8px 18px -8px var(--pri);transition:.2s;letter-spacing:.02em}.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn.g,.btn.r{box-shadow:none;background:transparent;border:1px solid var(--bd)}.btn.g:hover{border-color:var(--pri);color:var(--pri)}.btn.r:hover{background:#fde4e1}
input,select,textarea{background:var(--card);transition:.2s}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 20%,transparent)}
label{text-transform:uppercase;letter-spacing:.07em;font-size:10.5px;font-weight:600}
input[type=color]{padding:2px;height:38px;cursor:pointer}input[type=range]{padding:0;accent-color:var(--pri)}input[type=checkbox]{accent-color:var(--pri)}
.line{background:var(--tint2);border-color:var(--bd)}
.empty{padding:38px}.empty:before{content:'🦋';display:block;font-size:30px;margin-bottom:6px;opacity:.6}
@media(min-width:821px){#paper{position:sticky;top:16px}}
.paper{border-radius:10px;box-shadow:0 24px 50px -22px rgba(74,63,69,.4);position:relative;overflow:hidden}
.paper:after{content:'🦋';position:absolute;right:18px;bottom:12px;font-size:22px;opacity:.15}
.paper .head{border-bottom:1px solid var(--tint);padding-bottom:16px}.paper h2{letter-spacing:.02em}
.paper th{text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:var(--pri)}.paper td{border-bottom:1px solid #f1e9e4}.paper tr:nth-child(even) td{background:var(--tint2)}
.paper .big span:last-child{color:var(--pri);font-size:17px}
@media(max-width:820px){nav button.on:after{display:none}nav{box-shadow:0 -8px 24px -12px rgba(74,63,69,.3)}}
@media(max-width:820px){
#app{flex-direction:column}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5;border-top:1px solid var(--bd);border-right:0}
nav .logo{display:none}nav button{text-align:center;font-size:12px;padding:8px 2px;margin:0}
main{padding:16px 14px 90px}.ed{grid-template-columns:1fr}.g2{grid-template-columns:1fr}
.l{display:block;overflow-x:auto}
}
@media print{
body{background:#fff}nav,.no-print,.form{display:none!important}
main{padding:0;max-width:none}.ed{display:block}.paper{box-shadow:none;padding:0}:root{padding:0}
}
</style></head>

const fd=d=>d?d.split('-').reverse().join('/'):'';
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const addDays=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const cname=id=>(S.clients.find(c=>c.id===id)||{}).name||'—';
let view='dash',cur=null;

function tot(i){let ht=0,tva=0;i.items.forEach(l=>{const t=l.q*l.p;ht+=t;if(!S.profile.ae)tva+=t*l.v/100});
 const k=1-(i.discount||0)/100;ht*=k;tva*=k;return{ht,tva,ttc:ht+tva}}
function status(i){return i.status==='sent'&&i.due<today()?'late':i.status}
const SL={draft:'Brouillon',sent:'Envoyée',paid:'Payée',late:'En retard'};
function nextNum(type){const p={FACTURE:'F',DEVIS:'D',AVOIR:'A'}[type]||'F',y=new Date().getFullYear();
 const n=S.invoices.filter(i=>i.type===type&&i.number.startsWith(p+'-'+y)).length+1;return`${p}-${y}-${String(n).padStart(3,'0')}`}
function newDoc(type){return{id:uid(),type:type||'FACTURE',number:nextNum(type||'FACTURE'),date:today(),due:addDays(30),clientId:S.clients[0]?S.clients[0].id:'',items:[{d:'Prestation de service',q:1,p:100,v:20}],discount:0,status:'draft',notes:''}}

function go(v){view=v;render()}
function render(){applyStyle();
 const items=[['dash','🏠 Accueil'],['list','🧾 Documents'],['clients','👥 Clients'],['set','⚙️ Profil'],['style','🎀 Style']];
 $('#nav').innerHTML='<div class="logo">'+(S.profile.logo?'<img src="'+S.profile.logo+'" alt="Logo">':'Factur\'Indé')+'</div>'+items.map(([k,l])=>`<button class="${view===k||(view==='edit'&&k==='list')?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 const m=$('#main');
 if(view==='dash')m.innerHTML=dash();else if(view==='list')m.innerHTML=list();
 else if(view==='clients')m.innerHTML=clients();else if(view==='set')m.innerHTML=settings();else if(view==='style'){cur=demo();m.innerHTML=styleView();pv()}
 else{m.innerHTML=editor();pv()}
 window.scrollTo(0,0)}

function dash(){
 const y=new Date().getFullYear().toString();let paid=0,wait=0,late=0,dr=0;
 S.invoices.filter(i=>i.type==='FACTURE').forEach(i=>{const t=tot(i).ttc,s=status(i);
  if(s==='paid'&&i.date.startsWith(y))paid+=t;else if(s==='sent')wait+=t;else if(s==='late')late+=t;else if(s==='draft')dr++});
 const ae=S.profile.ae?`<div class="card kpi"><small>Plafond micro-entreprise (services BNC 77 700 €)</small><b>${Math.min(100,Math.round(paid/777))} %</b></div>`:'';
 return`<div class="top"><div><h1 style="margin:0">Coucou 🦋</h1><small style="color:var(--mut)">Voici l'état de vos factures aujourd'hui ✦</small></div><div><button class="btn" onclick="cur=newDoc('FACTURE');view='edit';render()">+ Nouvelle facture</button> <button class="btn g" onclick="cur=newDoc('DEVIS');view='edit';render()">+ Devis</button></div></div>
 <div class="band"><div class="mq"><span>Factures claires ✦</span><span>Devis en un clic ✦</span><span>PDF prêt à envoyer ✦</span><span>Factures claires ✦</span><span>Devis en un clic ✦</span><span>PDF prêt à envoyer ✦</span></div></div><div class="kpis"><div class="card kpi"><span class="ic">💰</span><small>Encaissé ${y}</small><b style="color:var(--ok)">${eur(paid)}</b></div>
 <div class="card kpi"><span class="ic">⏳</span><small>En attente</small><b style="color:var(--warn)">${eur(wait)}</b></div>
 <div class="card kpi"><span class="ic">🔔</span><small>En retard</small><b style="color:var(--bad)">${eur(late)}</b></div>
 <div class="card kpi"><span class="ic">✏️</span><small>Brouillons</small><b>${dr}</b></div>${ae}</div>
 <div class="card"><h3>Derniers documents</h3>${tbl(S.invoices.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}</div>
 ${S.profile.name?'':'<div class="card">👉 Commencez par compléter votre <a href="#" onclick="go(\'set\');return false">profil</a> et ajouter un <a href="#" onclick="go(\'clients\');return false">client</a>.</div>'}`}

function tbl(a){if(!a.length)return'<div class="empty">Aucun document pour le moment.</div>';
 return`<table class="l"><tr><th>N°</th><th>Type</th><th>Client</th><th>Date</th><th class="tr">Total TTC</th><th>Statut</th><th></th></tr>`+a.map(i=>{const s=status(i);
 return`<tr><td><b>${esc(i.number)}</b></td><td>${i.type}</td><td>${esc(cname(i.clientId))}</td><td>${fd(i.date)}</td><td class="tr">${eur(tot(i).ttc)}</td>
 <td><span class="badge ${s}">${SL[s]}</span></td><td class="tr" style="white-space:nowrap"><button class="btn g s" onclick="open_('${i.id}')">Ouvrir</button> <button class="btn g s" onclick="dup('${i.id}')">Dupliquer</button> <button class="btn r s" onclick="del('${i.id}')">✕</button></td></tr>`}).join('')+'</table>'}
function list(){return`<div class="top"><h1>Documents</h1><div><button class="btn" onclick="cur=newDoc('FACTURE');view='edit';render()">+ Facture</button> <button class="btn g" onclick="cur=newDoc('DEVIS');view='edit';render()">+ Devis</button></div></div><div class="card">${tbl(S.invoices.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</div>`}
function open_(id){cur=JSON.parse(JSON.stringify(S.invoices.find(i=>i.id===id)));view='edit';render()}
function dup(id){const c=JSON.parse(JSON.stringify(S.invoices.find(i=>i.id===id)));c.id=uid();c.number=nextNum(c.type);c.status='draft';c.date=today();c.due=addDays(30);S.invoices.push(c);persist();render()}
function del(id){if(confirm('Supprimer ce document ?')){S.invoices=S.invoices.filter(i=>i.id!==id);persist();render()}}

function clients(){return`<div class="top"><h1>Clients</h1></div><div class="ed"><div class="card"><h3>Nouveau client</h3>
 <label>Nom / Entreprise</label><input id="cn"><label>Adresse</label><textarea id="ca" rows="2"></textarea><div class="g2"><div><label>Email</label><input id="ce"></div><div><label>SIRET (optionnel)</label><input id="cs"></div></div>
 <p><button class="btn" onclick="addClient()">Ajouter</button></p></div>
 <div class="card"><h3>Vos clients (${S.clients.length})</h3>${S.clients.length?S.clients.map(c=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd)"><div><b>${esc(c.name)}</b><br><small style="color:var(--mut)">${esc(c.email)}</small></div><button class="btn r s" onclick="delClient('${c.id}')">✕</button></div>`).join(''):'<div class="empty">Aucun client.</div>'}</div></div>`}
function addClient(){const n=$('#cn').value.trim();if(!n)return;S.clients.push({id:uid(),name:n,address:$('#ca').value,email:$('#ce').value,siret:$('#cs').value});persist();render()}
function delClient(id){S.clients=S.clients.filter(c=>c.id!==id);persist();render()}

function settings(){const p=S.profile;const f=(k,l,t)=>`<label>${l}</label><input value="${esc(p[k])}" oninput="S.profile.${k}=this.value;persist()" ${t||''}>`;
 return`<div class="top"><h1>Mon profil</h1></div><div class="card" style="max-width:640px">
 <label>Logo</label><div style="display:flex;align-items:center;gap:10px">${p.logo?`<img src="${p.logo}" style="height:56px">`:''}<input type="file" accept="image/*" onchange="upLogo(this)" style="flex:1"><button class="btn r s" onclick="S.profile.logo='';persist();render()">Retirer</button></div>${f('name','Nom / Raison sociale')}<label>Adresse</label><textarea rows="2" oninput="S.profile.address=this.value;persist()">${esc(p.address)}</textarea>
 <div class="g2"><div>${f('email','Email / Téléphone')}</div><div>${f('siret','SIRET')}</div></div>
 <div class="g2"><div>${f('iban','IBAN')}</div><div>${f('bic','BIC')}</div></div>${f('tva','N° TVA intracommunautaire (si assujetti)')}
 <label><input type="checkbox" style="width:auto" ${p.ae?'checked':''} onchange="S.profile.ae=this.checked;persist()"> Franchise en base de TVA (micro-entrepreneur) – « TVA non applicable, art. 293 B du CGI »</label>
 <label>Conditions de paiement & mentions</label><textarea rows="3" oninput="S.profile.terms=this.value;persist()">${esc(p.terms)}</textarea>
 <p><button class="btn g s" onclick="go('style')">🎀 Personnaliser le style</button></p>
 <small style="color:var(--mut)">Vos données restent dans ce navigateur (stockage local).</small></div>`}

function editor(){const d=cur;
 return`<div class="top no-print"><h1>${d.type==='DEVIS'?'Devis':d.type==='AVOIR'?'Avoir':'Facture'} ${esc(d.number)}</h1><div>
 <button class="btn g" onclick="go('list')">Retour</button> <button class="btn" onclick="dlPdf()">⬇️ Télécharger PDF</button> <button class="btn g" onclick="window.print()">🖨 Imprimer</button> <button class="btn" onclick="saveDoc()">Enregistrer</button></div></div>
 <div class="ed"><div class="form"><div class="card"><div class="g2"><div><label>Type</label><select onchange="cur.type=this.value;cur.number=nextNum(this.value);render()">${['FACTURE','DEVIS','AVOIR'].map(t=>`<option ${d.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
 <div><label>Numéro</label><input value="${esc(d.number)}" oninput="cur.number=this.value;pv()"></div>
 <div><label>Date</label><input type="date" value="${d.date}" onchange="cur.date=this.value;pv()"></div>
 <div><label>Échéance / validité</label><input type="date" value="${d.due}" onchange="cur.due=this.value;pv()"></div></div>
 <label>Client</label><select onchange="cur.clientId=this.value;pv()"><option value="">— Choisir —</option>${S.clients.map(c=>`<option value="${c.id}" ${d.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
 ${S.clients.length?'':'<small style="color:var(--mut)">Ajoutez d\'abord un client dans l\'onglet Clients.</small>'}</div>
 <div class="card"><div class="top" style="margin:0 0 8px"><h3 style="margin:0">Prestations</h3><button class="btn g s" onclick="cur.items.push({d:'',q:1,p:0,v:20});render()">+ Ligne</button></div>
 ${d.items.map((l,i)=>`<div class="line"><div style="display:flex;gap:6px"><input placeholder="Description" value="${esc(l.d)}" oninput="cur.items[${i}].d=this.value;pv()"><button class="btn r s" onclick="if(cur.items.length>1){cur.items.splice(${i},1);render()}">✕</button></div>
 <div class="g3"><div><label>Qté</label><input type="number" step="any" value="${l.q}" oninput="cur.items[${i}].q=parseFloat(this.value)||0;pv()"></div>
 <div><label>Prix HT €</label><input type="number" step="any" value="${l.p}" oninput="cur.items[${i}].p=parseFloat(this.value)||0;pv()"></div>
 <div><label>TVA</label><select ${S.profile.ae?'disabled':''} onchange="cur.items[${i}].v=parseFloat(this.value);pv()">${[20,10,5.5,0].map(v=>`<option ${l.v===v?'selected':''}>${v}</option>`).join('')}</select></div></div></div>`).join('')}</div>
 <div class="card"><div class="g2"><div><label>Remise (%)</label><input type="number" min="0" max="100" value="${d.discount}" oninput="cur.discount=parseFloat(this.value)||0;pv()"></div>
 <div><label>Statut</label><select onchange="cur.status=this.value">${['draft','sent','paid'].map(s=>`<option value="${s}" ${d.status===s?'selected':''}>${SL[s]}</option>`).join('')}</select></div></div>
 <label>Note (optionnel)</label><textarea rows="2" oninput="cur.notes=this.value;pv()">${esc(d.notes)}</textarea></div></div>
 <div id="paper" class="paper"></div></div>`}

function pv(){const d=cur,p=S.profile,c=S.clients.find(x=>x.id===d.clientId)||{},t=tot(d);$('#paper').className='paper t-'+S.style.tpl;
 $('#paper').innerHTML=`<div class="head"><div>${p.logo?`<img src="${p.logo}" style="height:78px;display:block;margin:0 0 6px -4px">`:''}<h2>${esc(p.name||'Votre entreprise')}</h2><div class="mut" style="white-space:pre-line">${esc(p.address)}</div><div class="mut">${esc(p.email)}</div><div class="mut">${p.siret?'SIRET '+esc(p.siret):''} ${p.tva?'· TVA '+esc(p.tva):''}</div></div>
 <div style="text-align:right"><div class="tag">${d.type}</div><b>${esc(d.number)}</b><div class="mut">Date : ${fd(d.date)}</div><div class="mut">${d.type==='DEVIS'?'Valable jusqu\'au':'Échéance'} : ${fd(d.due)}</div></div></div>
 <div style="background:var(--tint2);border-radius:8px;padding:10px;margin-bottom:6px"><div class="mut">${d.type==='DEVIS'?'Destinataire':'Facturé à'}</div><b>${esc(c.name||'Client')}</b><div class="mut" style="white-space:pre-line">${esc(c.address)}</div><div class="mut">${esc(c.email)} ${c.siret?'· SIRET '+esc(c.siret):''}</div></div>
 <table><tr><th>Description</th><th>Qté</th><th>PU HT</th>${p.ae?'':'<th>TVA</th>'}<th style="text-align:right">Total HT</th></tr>
 ${d.items.map(l=>`<tr><td>${esc(l.d)}</td><td>${l.q}</td><td>${eur(l.p)}</td>${p.ae?'':`<td>${l.v}%</td>`}<td style="text-align:right">${eur(l.q*l.p)}</td></tr>`).join('')}</table>
 <div class="tot">${d.discount?`<div><span>Remise</span><span>-${d.discount}%</span></div>`:''}<div><span>Total HT</span><span>${eur(t.ht)}</span></div>${p.ae?'':`<div><span>TVA</span><span>${eur(t.tva)}</span></div>`}<div class="big"><span>Total TTC</span><span>${eur(t.ttc)}</span></div></div>
 ${d.notes?`<p style="white-space:pre-line">${esc(d.notes)}</p>`:''}
 <div class="thx">${esc(S.style.thanks)}</div><div class="mut" style="margin-top:14px;font-size:11px;white-space:pre-line">${p.ae?'TVA non applicable, art. 293 B du CGI\n':''}${p.iban?'IBAN : '+esc(p.iban)+(p.bic?' · BIC : '+esc(p.bic):'')+'\n':''}${esc(p.terms)}</div>`}
const PRE={kabijoux:['#b86098','#f0e8de','#4a3f45'],rose:['#ec4899','#fff0f6','#4a2040'],lilas:['#a855f7','#f6f0ff','#3b2556'],pêche:['#fb7185','#fff4ee','#5a2e2e'],matcha:['#65a30d','#f4fbea','#2f3d1f'],ciel:['#38bdf8','#eefaff','#1e3a52'],nuit:['#f472b6','#1b1226','#f8e8ff']};
const mix=(a,b,p)=>{const x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16),f=s=>Math.round(((x>>s)&255)*p+((y>>s)&255)*(1-p));return'#'+((1<<24)|(f(16)<<16)|(f(8)<<8)|f(0)).toString(16).slice(1)};
const lum=h=>{const n=parseInt(h.slice(1),16);return(((n>>16)&255)*.3+((n>>8)&255)*.59+(n&255)*.11)/255};
function applyStyle(){const s=S.style,r=document.documentElement.style,dk=lum(s.bg)<.4,card=dk?mix('#ffffff',s.bg,.1):'#ffffff';
 r.setProperty('--pri',s.pri);r.setProperty('--bg',s.bg);r.setProperty('--tx',s.tx);r.setProperty('--r',s.r+'px');r.setProperty('--card',card);
 r.setProperty('--bd',mix(s.pri,card,.25));r.setProperty('--mut',mix(s.tx,s.bg,.6));r.setProperty('--tint',mix(s.pri,'#ffffff',.14));r.setProperty('--tint2',mix(s.pri,'#ffffff',.06));r.setProperty('--band',mix(s.pri,'#ffffff',.55));
 r.setProperty('--hf',"'"+s.hf+"',serif");r.setProperty('--bf',"'"+s.bf+"',sans-serif")}
function setS(k,v){S.style[k]=v;persist();applyStyle();if($('#paper'))pv()}
function setPre(n){const p=PRE[n];S.style.pri=p[0];S.style.bg=p[1];S.style.tx=p[2];persist();render()}
function demo(){const d=newDoc('FACTURE');d.items=[{d:'Shooting photo',q:1,p:150,v:20},{d:'Retouches',q:2,p:40,v:20}];return d}
function styleView(){const s=S.style,o=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
 return`<div class="top"><h1>Mon style 🎀</h1></div><div class="ed"><div class="card"><h3>Palettes</h3><div style="display:flex;flex-wrap:wrap;gap:8px">${Object.keys(PRE).map(k=>`<button class="btn g s" onclick="setPre('${k}')"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${PRE[k][0]}"></span> ${k}</button>`).join('')}</div>
 <div class="g2"><div><label>Couleur principale</label><input type="color" value="${s.pri}" oninput="setS('pri',this.value)"></div><div><label>Fond</label><input type="color" value="${s.bg}" oninput="setS('bg',this.value)"></div>
 <div><label>Texte</label><input type="color" value="${s.tx}" oninput="setS('tx',this.value)"></div><div><label>Arrondi des coins</label><input type="range" min="0" max="30" value="${s.r}" oninput="setS('r',+this.value)"></div>
 <div><label>Police des titres</label><select onchange="setS('hf',this.value)">${o(['Cormorant Garamond','Playfair Display','Dancing Script','Quicksand','Inter'],s.hf)}</select></div>
 <div><label>Police du texte</label><select onchange="setS('bf',this.value)">${o(['Source Sans 3','Quicksand','Inter','Playfair Display'],s.bf)}</select></div>
 <div><label>Modèle de facture</label><select onchange="setS('tpl',this.value)">${o(['doux','cadre','bandeau'],s.tpl)}</select></div></div>
 <label>Petit mot en bas de facture</label><input value="${esc(s.thanks)}" oninput="setS('thanks',this.value)"><p><button class="btn g s" onclick="S.style={...DS};persist();render()">↺ Réinitialiser</button></p></div>
 <div id="paper" class="paper"></div></div>`}
async function dlPdf(){window.scrollTo(0,0);
 try{const dl=window.claude?await window.claude.use('downloads'):null;
  const blob=await html2pdf().set({margin:8,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,windowWidth:794,scrollY:0,onclone:d=>{d.getElementById('paper').style.boxShadow='none'}},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from($('#paper')).outputPdf('blob');
  if(dl)await dl.save({filename:(cur.number||'facture')+'.pdf',data:blob});else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(cur.number||'facture')+'.pdf';document.body.appendChild(a);a.click();a.remove()}}
 catch(e){if(!e||e.code!=='declined')alert("Le PDF n'a pas pu être créé. Essayez « Imprimer » puis « Enregistrer au format PDF ».")}}
function upLogo(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const i=new Image();i.onload=()=>{const k=Math.min(1,400/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);S.profile.logo=c.toDataURL('image/png');persist();render()};i.src=e.target.result};r.readAsDataURL(f)}
function saveDoc(){const i=S.invoices.findIndex(x=>x.id===cur.id);if(i>=0)S.invoices[i]=cur;else S.invoices.push(cur);persist();go('list')}
render();
</script></body></html>
